[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interfayce"
version = "1.0.0"
description = "Personal VRChat cockpit groundwork"
requires-python = ">=3.11"
license = { text = "Private" }
readme = "README.md"
dependencies = [
    "winrt-Windows.Foundation>=3.2,<4",
    "winrt-Windows.Foundation.Collections>=3.2,<4",
    "winrt-Windows.Media.Control>=3.2,<4",
    "winrt-Windows.Storage.Streams>=3.2,<4",
    "openvr>=2.12,<3",
]

[project.optional-dependencies]
voice = [
    "numpy>=2,<3",
    "sherpa-onnx>=1.12,<2",
    "SpeechRecognition>=3.14,<4",
    "PyAudio>=0.2.14,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
